<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="logo">✳</span>
        <span class="title">Claude</span>
        <span id="status" class="status" title="Bridge status"></span>
      </div>
      <div class="spacer"></div>
      <button id="historyBtn" class="icon-btn" title="History">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.7"/></svg>
      </button>
      <button id="clearBtn" class="icon-btn" title="Clear chat (start new)">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
      </button>
      <button id="settingsBtn" class="icon-btn" title="Settings">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.1 12.9a7.6 7.6 0 0 0 0-1.8l1.9-1.5-1.9-3.3-2.3 1a7.3 7.3 0 0 0-1.6-.9l-.3-2.4h-3.8l-.3 2.4a7.3 7.3 0 0 0-1.6.9l-2.3-1L3 9.6l1.9 1.5a7.6 7.6 0 0 0 0 1.8L3 14.4l1.9 3.3 2.3-1a7.3 7.3 0 0 0 1.6.9l.3 2.4h3.8l.3-2.4a7.3 7.3 0 0 0 1.6-.9l2.3 1 1.9-3.3-1.9-1.5Z"/></svg>
      </button>
    </header>

    <section id="settings" class="sheet hidden">
      <label>Model
        <select id="model">
          <option value="sonnet">Sonnet (recommended)</option>
          <option value="opus">Opus (most capable)</option>
          <option value="haiku">Haiku (fastest)</option>
        </select>
      </label>
      <label>Appearance
        <select id="theme">
          <option value="auto">Auto (match page)</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <label>Custom instructions (persona)
        <textarea id="persona" rows="3" placeholder="e.g. Always answer concisely and in British English."></textarea>
      </label>
      <label class="check"><input id="guard" type="checkbox" checked /> Ask before risky actions (submit, send, delete, buy)</label>
      <button id="saveSettings" class="primary">Save</button>
      <p class="hint">Runs on your Claude subscription via the local bridge — no API key. Start it with <b>bridge/run-bridge.bat</b>. Header dot: ● connected / ○ offline.</p>
    </section>

    <section id="history" class="sheet hidden">
      <div class="hist-head">
        <span>Recent chats</span>
        <button id="histClear" class="linkbtn" title="Delete all">clear all</button>
      </div>
      <div id="histList"></div>
    </section>

    <main id="log">
      <div id="welcome" class="welcome">
        <div class="welcome-logo">✳</div>
        <div class="welcome-title">How can I help on this page?</div>
        <div class="welcome-sub">Ask anything, or try one of these:</div>
        <div class="sugg">
          <button class="sugg-card" data-action="summarize"><b>Summarize</b><span>the key ideas on this page</span></button>
          <button class="sugg-card" data-action="keypoints"><b>Key points</b><span>as a quick bullet list</span></button>
          <button class="sugg-card" data-action="explain"><b>Explain</b><span>what this page is about</span></button>
          <button class="sugg-card" data-action="translate"><b>Translate</b><span>the content to English</span></button>
        </div>
      </div>
    </main>

    <div id="actions" class="actions hidden">
      <button class="chip" data-action="summarize">Summarize</button>
      <button class="chip" data-action="keypoints">Key points</button>
      <button class="chip" data-action="explain">Explain</button>
      <button class="chip" data-action="translate">Translate</button>
      <button class="chip" data-action="tldr">TL;DR</button>
    </div>

    <div class="composer">
      <div id="imgChips" class="img-chips hidden"></div>
      <div id="ctxChips" class="ctx-chips hidden"></div>
      <textarea id="input" rows="1" placeholder="Ask Claude to do something in this tab…  (paste an image to analyze)"></textarea>
      <input id="fileInput" type="file" accept="image/*" multiple hidden />
      <div class="composer-bar">
        <button id="attachBtn" class="pill icon-pill" title="Attach image">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5 12.5 20a5 5 0 0 1-7-7l8-8a3.3 3.3 0 0 1 4.7 4.7l-8 8a1.6 1.6 0 0 1-2.3-2.3l7.3-7.3"/></svg>
        </button>
        <button id="researchBtn" class="pill toggle" title="Web search mode">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z"/></svg>
          <span>Search</span>
        </button>
        <select id="model2" class="pill" title="Model">
          <option value="sonnet">Sonnet</option>
          <option value="opus">Opus</option>
          <option value="haiku">Haiku</option>
        </select>
        <select id="effort" class="pill" title="Effort (per message)">
          <option value="low">low</option>
          <option value="medium">med</option>
          <option value="high" selected>high</option>
          <option value="xhigh">xhigh</option>
          <option value="max">max</option>
        </select>
        <div class="spacer"></div>
        <button id="send" class="send-btn" title="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>
        </button>
      </div>
    </div>

    <script src="sidepanel.js"></script>
  </body>
</html>
